<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Familien-Abenteuer{% endblock %}</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;800&family=Chewy&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    {% with messages = get_flashed_messages() %}
      {% if messages %}
        <div class="flash-messages">
          {% for message in messages %}
            <div class="flash-message">{{ message }}</div>
          {% endfor %}
        </div>
      {% endif %}
    {% endwith %}

    <nav class="navbar">
        <div class="nav-brand">
            <i class="fa-solid fa-star"></i> Familien-Abenteuer
        </div>
        <div class="nav-links">
            <a href="{{ url_for('index') }}" class="nav-btn"><i class="fa-solid fa-ticket"></i> Rubbellos</a>
            <a href="{{ url_for('admin') }}" class="nav-btn"><i class="fa-solid fa-gear"></i> Admin</a>
        </div>
    </nav>

    <main class="container">
        {% block content %}{% endblock %}
    </main>

    {% block scripts %}{% endblock %}
</body>
</html>
